schema: spec-driven

# Project context
# This is shown to AI when creating artifacts.
context: |
  Tech stack:
  - Backend: Python, FastAPI, MongoDB (Motor), Redis, Pydantic V2, JWT
  - Frontend: Vue 3, TypeScript, Vite, Vue Router 5, Pinia, vxe-table 4, Axios

  Code conventions:
  - Backend: snake_case for files/functions, PascalCase for classes
  - Frontend: Composition API + <script setup lang="ts">
  - MongoDB collections: snake_case (e.g., sales_orders, product_categories)
  - API routes: kebab-case (e.g., /sales-orders, /procurement-orders)

  Response format:
  - Success: {status: "success", message: "...", result: {...}}
  - Error: {status: "error", message: "...", result: null}

  Domain: ERP system with sales, procurement, inventory, and finance modules

# Per-artifact rules
rules:
  proposal:
    - Keep proposals concise and actionable
    - Include implementation approach
    - Consider both frontend and backend impact
  tasks:
    - Break tasks into chunks of max 2 hours
    - Include verification steps
    - Reference relevant spec files